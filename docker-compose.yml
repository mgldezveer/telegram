version: '3.8'

services:
  bot:
    build: .
    container_name: ai-content-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - bot-network
    ports:
      - "9090:9090"

  db:
    image: postgres:15-alpine
    container_name: bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_content_bot}
      POSTGRES_USER: ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bot-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # Optional: Set Redis password
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      # To use password, update command to:
      # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  celery-worker:
    build: .
    container_name: bot-celery-worker
    restart: unless-stopped
    env_file: .env
    command: celery -A src.tasks worker --loglevel=info
    depends_on:
      - redis
      - db
    networks:
      - bot-network
    volumes:
      - ./logs:/app/logs

  prometheus:
    image: prom/prometheus:latest
    container_name: bot-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - bot-network
    ports:
      - "9091:9090"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  bot-network:
    driver: bridge
